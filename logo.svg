<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <rect width="200" height="200" fill="#ffffff" rx="0"/>
  <!-- S verde -->
  <text x="4" y="122" font-size="112" font-weight="900" fill="#2e7d32"
        font-family="Arial Black,Impact,sans-serif"
        stroke="#ffffff" stroke-width="5" paint-order="stroke">S</text>
  <!-- M gris con borde oscuro -->
  <text x="72" y="122" font-size="112" font-weight="900" fill="#bbbbbb"
        font-family="Arial Black,Impact,sans-serif"
        stroke="#333333" stroke-width="3" paint-order="stroke">M</text>
  <!-- Caja ACADEMIA -->
  <rect x="4" y="133" width="192" height="60" fill="#ffffff" stroke="#111111" stroke-width="6" rx="4"/>
  <text x="100" y="174" font-size="29" font-weight="900" fill="#111111"
        font-family="Arial Black,Impact,sans-serif" text-anchor="middle"
        letter-spacing="2">ACADEMIA</text>
</svg>
