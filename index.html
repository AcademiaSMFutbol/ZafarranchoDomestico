<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Agenda corporativa SM Academia">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SM Agenda">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <title>Agenda SM Academia</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              50:'#fafafa', 100:'#f5f5f5', 200:'#cccccc', 300:'#aaaaaa',
              400:'#888888', 500:'#666666', 600:'#444444', 700:'#2a2a2a',
              800:'#1a1a1a', 900:'#0a0a0a', 950:'#000000',
            },
            indigo: {
              50:'#f0fdf4', 100:'#dcfce7', 200:'#bbf7d0', 300:'#86efac',
              400:'#4ade80', 500:'#22c55e', 600:'#16a34a', 700:'#2e7d32',
              800:'#1b5e20', 900:'#14532d', 950:'#071a08',
            },
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- HEADER                                                    -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <header>
    <div class="header-inner">

      <!-- Logo SM Academia -->
      <div class="header-brand">
        <div class="logo-badge">
          <!-- Logo inline compacto -->
          <svg width="38" height="38" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <rect width="200" height="200" fill="#fff" rx="6"/>
            <text x="4" y="122" font-size="112" font-weight="900" fill="#2e7d32"
                  font-family="Arial Black,Impact,sans-serif"
                  stroke="#fff" stroke-width="5" paint-order="stroke">S</text>
            <text x="72" y="122" font-size="112" font-weight="900" fill="#bbbbbb"
                  font-family="Arial Black,Impact,sans-serif"
                  stroke="#333" stroke-width="3" paint-order="stroke">M</text>
            <rect x="4" y="133" width="192" height="60" fill="#fff" stroke="#111" stroke-width="6" rx="4"/>
            <text x="100" y="174" font-size="29" font-weight="900" fill="#111"
                  font-family="Arial Black,Impact,sans-serif" text-anchor="middle" letter-spacing="2">ACADEMIA</text>
          </svg>
        </div>
        <div class="header-brand-text">
          <p class="brand-label">SM Academia</p>
          <p id="date-header" class="brand-date"></p>
        </div>
      </div>

      <!-- Stats (solo desktop) -->
      <div class="header-stats">
        <div class="stat-chip">
          <svg style="color:#4ade80;" width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span class="stat-label">Hoy:</span>
          <span id="stat-events" class="stat-val green">0</span>
        </div>
        <div class="stat-chip">
          <svg style="color:#f59e0b;" width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
          <span class="stat-label">Pendientes:</span>
          <span id="stat-pending" class="stat-val amber">0</span>
        </div>
        <div class="stat-chip red">
          <svg style="color:#ff8a80;" width="11" height="11" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span class="stat-label" style="color:#ff8a80;">Alta:</span>
          <span id="stat-high" class="stat-val" style="color:#ff8a80;">0</span>
        </div>
      </div>

      <!-- Acciones -->
      <div class="header-actions">
        <div class="status-wrap">
          <div id="status-dot" class="status-dot disconnected"></div>
          <span id="status-text" class="status-text">Sin configurar</span>
          <span id="sync-info" class="sync-info"></span>
        </div>
        <button id="btn-sync" onclick="syncData()" title="Sincronizar" class="btn-ghost icon-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>
        <button onclick="openSettings()" title="Configuración" class="btn-ghost icon-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
        <button onclick="openNewModal()" class="btn-primary">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span class="btn-label">Nueva</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- MAIN                                                      -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <main>
    <div class="main-grid">

      <!-- Timeline de hoy -->
      <section class="grid-col">
        <div class="card">
          <div class="section-header">
            <span class="section-title">
              <svg style="color:#4ade80;" width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              Agenda de hoy
            </span>
            <button onclick="openNewModal('evento')" class="section-add" style="color:#4ade80;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Evento
            </button>
          </div>
          <div id="timeline-list"></div>
        </div>
      </section>

      <!-- Buzón + Notas -->
      <section class="grid-col">
        <div class="card">
          <div class="section-header">
            <span class="section-title">
              <svg style="color:#f59e0b;" width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
                <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
              </svg>
              Buzón de pendientes
            </span>
            <button onclick="openNewModal('tarea')" class="section-add" style="color:#f59e0b;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Tarea
            </button>
          </div>
          <div id="inbox-list"></div>
        </div>

        <div class="card">
          <div class="section-header">
            <span class="section-title">
              <svg style="color:#f59e0b;" width="14" height="14" viewBox="0 0 24 24" fill="none"
                   stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/>
                <polyline points="15 3 15 9 21 9"/>
              </svg>
              Notas rápidas
            </span>
            <button onclick="saveNotes()" class="section-add" style="color:#f59e0b;">
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                   stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
              </svg>
              Guardar
            </button>
          </div>
          <textarea id="quick-notes" class="posit-area"
            placeholder="Escribe aquí ideas, recordatorios o notas al vuelo...&#10;Se guardan automáticamente en tu navegador."></textarea>
          <p class="notes-hint">Auto-guardado local · Ctrl+N para nueva tarea</p>
        </div>
      </section>
    </div>
  </main>

  <!-- Modales -->
  <div id="modal-form"     style="display:none;" class="modal-backdrop"></div>
  <div id="modal-settings" style="display:none;" class="modal-backdrop"></div>
  <div id="toast-container"></div>

  <!-- Onboarding -->
  <div id="onboarding-banner" style="display:none;position:fixed;bottom:1.5rem;left:1rem;right:1rem;z-index:90;">
    <div class="card" style="border-color:#2e7d32;box-shadow:0 0 20px rgba(46,125,50,.3);padding:1rem;">
      <div style="display:flex;align-items:flex-start;gap:.75rem;">
        <div style="flex-shrink:0;width:32px;height:32px;background:#071a08;border:1px solid #1b4d1e;border-radius:8px;display:flex;align-items:center;justify-content:center;">
          <svg style="color:#4ade80;" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <div style="flex:1;min-width:0;">
          <p style="font-size:.875rem;font-weight:700;color:#fff;">Configura tu GitHub</p>
          <p style="font-size:.75rem;color:#888;margin-top:.25rem;">Conecta tu repositorio para sincronizar la agenda</p>
          <button onclick="openSettings(); document.getElementById('onboarding-banner').style.display='none';"
                  class="btn-primary" style="margin-top:.75rem;font-size:.75rem;padding:.375rem .75rem;">
            Configurar ahora
          </button>
        </div>
        <button onclick="this.closest('#onboarding-banner').style.display='none'"
                style="color:#444;flex-shrink:0;" class="hover:text-white">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (function() {
      try {
        const cfg = JSON.parse(localStorage.getItem('agendaCorp_config')) || {};
        if (!cfg.token || !cfg.owner || !cfg.repo) {
          setTimeout(() => {
            document.getElementById('onboarding-banner').style.display = 'block';
          }, 1200);
        }
      } catch(e) {}
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
