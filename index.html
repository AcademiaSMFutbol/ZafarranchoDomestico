<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda corporativa PWA con sincronización GitHub">
  <meta name="theme-color" content="#0f172a">

  <!-- PWA manifest -->
  <link rel="manifest" href="manifest.json">

  <title>Agenda Corporativa</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom styles -->
  <link rel="stylesheet" href="styles.css">

  <script>
    /* Tailwind v4 config override for dark mode */
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              950: '#020617',
            }
          }
        }
      }
    }
  </script>
</head>

<body class="min-h-screen bg-slate-950 text-slate-200">

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- HEADER                                                     -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-sm sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between gap-4">

      <!-- Left: Logo + Date -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex-shrink-0 w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="text-white">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Agenda</p>
          <p id="date-header" class="text-sm font-bold text-slate-100 truncate"></p>
        </div>
      </div>

      <!-- Center: Stats chips (hidden on mobile) -->
      <div class="hidden sm:flex items-center gap-2 flex-shrink-0">
        <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-full px-3 py-1 text-xs">
          <svg class="text-indigo-400" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span class="text-slate-400">Hoy:</span>
          <span id="stat-events" class="text-indigo-300 font-bold">0</span>
        </div>
        <div class="flex items-center gap-1.5 bg-slate-800 border border-slate-700 rounded-full px-3 py-1 text-xs">
          <svg class="text-amber-400" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          <span class="text-slate-400">Pendientes:</span>
          <span id="stat-pending" class="text-amber-300 font-bold">0</span>
        </div>
        <div class="flex items-center gap-1.5 bg-red-950 border border-red-900 rounded-full px-3 py-1 text-xs">
          <svg class="text-red-400" xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span class="text-red-400">Alta prioridad:</span>
          <span id="stat-high" class="text-red-300 font-bold">0</span>
        </div>
      </div>

      <!-- Right: Actions -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Status indicator -->
        <div class="hidden sm:flex items-center gap-2 mr-1">
          <div id="status-dot" class="status-dot disconnected"></div>
          <span id="status-text" class="text-xs text-slate-400">Sin configurar</span>
          <span id="sync-info" class="text-xs text-slate-600"></span>
        </div>

        <!-- Sync -->
        <button id="btn-sync" onclick="syncData()" title="Sincronizar (F5)"
          class="btn-ghost !px-2.5 !py-2 text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
        </button>

        <!-- Settings -->
        <button onclick="openSettings()" title="Configuración" class="btn-ghost !px-2.5 !py-2 text-slate-400">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>

        <!-- New item -->
        <button onclick="openNewModal()" class="btn-primary !py-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span class="hidden sm:inline">Nueva</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MAIN GRID                                                  -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-6">
    <div class="main-grid grid gap-5" style="grid-template-columns: 1fr 1fr;">

      <!-- ─────────────────────────────────────────────────────── -->
      <!-- LEFT: Timeline de hoy                                  -->
      <!-- ─────────────────────────────────────────────────────── -->
      <section class="flex flex-col gap-4">
        <div class="card p-4 flex-1">
          <div class="section-header mb-4">
            <span class="flex items-center gap-2">
              <svg class="text-indigo-400" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              Agenda de hoy
            </span>
            <button onclick="openNewModal('evento')"
              class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Evento
            </button>
          </div>
          <div id="timeline-list" class="space-y-1"></div>
        </div>
      </section>

      <!-- ─────────────────────────────────────────────────────── -->
      <!-- RIGHT: Inbox + Quick Notes                             -->
      <!-- ─────────────────────────────────────────────────────── -->
      <section class="flex flex-col gap-4">

        <!-- Inbox pendientes -->
        <div class="card p-4 flex-1">
          <div class="section-header mb-4">
            <span class="flex items-center gap-2">
              <svg class="text-amber-400" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
              Buzón de pendientes
            </span>
            <button onclick="openNewModal('tarea')"
              class="text-xs text-amber-400 hover:text-amber-300 flex items-center gap-1 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              Tarea
            </button>
          </div>
          <div id="inbox-list" class="space-y-1"></div>
        </div>

        <!-- Quick Notes (Post-it) -->
        <div class="card p-4">
          <div class="section-header mb-3">
            <span class="flex items-center gap-2">
              <svg class="text-yellow-400" xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/><polyline points="15 3 15 9 21 9"/></svg>
              Notas rápidas
            </span>
            <button onclick="saveNotes()" class="text-xs text-yellow-500 hover:text-yellow-300 transition-colors flex items-center gap-1">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              Guardar
            </button>
          </div>
          <textarea id="quick-notes" class="posit-area"
            placeholder="Escribe aquí ideas, recordatorios o notas al vuelo...&#10;Se guardan automáticamente en tu navegador."></textarea>
          <p class="text-xs text-slate-600 mt-1.5">Auto-guardado local · Ctrl+N para nueva tarea</p>
        </div>

      </section>
    </div><!-- /grid -->
  </main>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- MODALS (injected by JS)                                    -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="modal-form"     style="display:none;" class="modal-backdrop"></div>
  <div id="modal-settings" style="display:none;" class="modal-backdrop"></div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- TOAST CONTAINER                                            -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="toast-container"></div>

  <!-- ═══════════════════════════════════════════════════════════ -->
  <!-- ONBOARDING BANNER (shown only when not configured)         -->
  <!-- ═══════════════════════════════════════════════════════════ -->
  <div id="onboarding-banner" class="fixed bottom-6 left-6 hidden max-w-sm">
    <div class="card p-4 border-indigo-800 shadow-2xl">
      <div class="flex items-start gap-3">
        <div class="flex-shrink-0 w-8 h-8 bg-indigo-900 rounded-lg flex items-center justify-center mt-0.5">
          <svg class="text-indigo-400" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold text-slate-100">Configura tu GitHub</p>
          <p class="text-xs text-slate-400 mt-0.5">Conecta tu repositorio para sincronizar la agenda</p>
          <button onclick="openSettings(); document.getElementById('onboarding-banner').style.display='none';"
            class="btn-primary mt-3 text-xs !py-1.5 !px-3">
            Configurar ahora
          </button>
        </div>
        <button onclick="this.closest('#onboarding-banner').style.display='none'"
          class="text-slate-600 hover:text-slate-400 flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- App JS -->
  <script src="app.js"></script>

  <!-- Show onboarding if not configured -->
  <script>
    (function() {
      try {
        const cfg = JSON.parse(localStorage.getItem('agendaCorp_config')) || {};
        if (!cfg.token || !cfg.owner || !cfg.repo) {
          setTimeout(() => {
            document.getElementById('onboarding-banner').style.display = 'block';
          }, 1200);
        }
      } catch(e) {}
    })();
  </script>
</body>
</html>
