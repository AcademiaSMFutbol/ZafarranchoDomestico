<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Agenda corporativa PWA con sincronización GitHub">
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.json">
  <title>Agenda Corporativa</title>

  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Paleta corporativa: indigo → verde #2e7d32 | slate → negro puro -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: {
              50:  '#fafafa',
              100: '#f5f5f5',
              200: '#cccccc',
              300: '#aaaaaa',
              400: '#888888',
              500: '#666666',
              600: '#444444',
              700: '#2a2a2a',
              800: '#1a1a1a',
              900: '#0a0a0a',
              950: '#000000',
            },
            indigo: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              200: '#bbf7d0',
              300: '#86efac',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#2e7d32',
              800: '#1b5e20',
              900: '#14532d',
              950: '#071a08',
            },
          }
        }
      }
    }
  </script>

  <link rel="stylesheet" href="styles.css">

  <!-- EmailJS SDK (para envío de emails desde el cliente) -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
</head>

<body class="min-h-screen" style="background:#000;color:#fff;">

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- HEADER — ancho completo                                   -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <header style="background:rgba(0,0,0,.95);border-bottom:1px solid #1f1f1f;"
          class="sticky top-0 z-40 w-full backdrop-blur-sm">
    <div class="w-full px-4 sm:px-6 h-16 flex items-center justify-between gap-4">

      <!-- Logo + Fecha -->
      <div class="flex items-center gap-3 min-w-0">
        <div class="flex-shrink-0 w-9 h-9 rounded-lg flex items-center justify-center"
             style="background:#2e7d32;">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24"
               fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div class="min-w-0">
          <p class="text-xs uppercase tracking-wider font-bold" style="color:#2e7d32;">Agenda</p>
          <p id="date-header" class="text-sm font-bold truncate" style="color:#fff;"></p>
        </div>
      </div>

      <!-- Stats chips (ocultos en móvil) -->
      <div class="hidden sm:flex items-center gap-2 flex-1 justify-center">
        <div class="stat-chip">
          <svg style="color:#4ade80;" xmlns="http://www.w3.org/2000/svg" width="11" height="11"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
          <span style="color:#888;">Hoy:</span>
          <span id="stat-events" style="color:#4ade80;font-weight:700;">0</span>
        </div>
        <div class="stat-chip">
          <svg style="color:#f59e0b;" xmlns="http://www.w3.org/2000/svg" width="11" height="11"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
            <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
          </svg>
          <span style="color:#888;">Pendientes:</span>
          <span id="stat-pending" style="color:#f59e0b;font-weight:700;">0</span>
        </div>
        <div class="stat-chip" style="border-color:#5c1010;background:#1a0505;">
          <svg style="color:#ff8a80;" xmlns="http://www.w3.org/2000/svg" width="11" height="11"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <span style="color:#ff8a80;">Alta:</span>
          <span id="stat-high" style="color:#ff8a80;font-weight:700;">0</span>
        </div>
      </div>

      <!-- Acciones -->
      <div class="flex items-center gap-2 flex-shrink-0">
        <!-- Estado conexión -->
        <div class="hidden sm:flex items-center gap-2 mr-1">
          <div id="status-dot" class="status-dot disconnected"></div>
          <span id="status-text" class="text-xs" style="color:#666;">Sin configurar</span>
          <span id="sync-info"   class="text-xs" style="color:#444;"></span>
        </div>

        <!-- Sync -->
        <button id="btn-sync" onclick="syncData()" title="Sincronizar"
                class="btn-ghost !px-2.5 !py-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
        </button>

        <!-- Settings -->
        <button onclick="openSettings()" title="Configuración" class="btn-ghost !px-2.5 !py-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>

        <!-- Nueva tarea/evento -->
        <button onclick="openNewModal()" class="btn-primary !py-2">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          <span class="hidden sm:inline">Nueva</span>
        </button>
      </div>
    </div>
  </header>

  <!-- ══════════════════════════════════════════════════════════ -->
  <!-- MAIN GRID                                                 -->
  <!-- ══════════════════════════════════════════════════════════ -->
  <main class="w-full px-4 sm:px-6 py-5">
    <div class="main-grid grid gap-4" style="grid-template-columns: 1fr 1fr;">

      <!-- ────── LEFT: Timeline de hoy ────────────────────────── -->
      <section class="flex flex-col gap-4">
        <div class="card p-4 flex-1">
          <div class="section-header mb-4">
            <span class="flex items-center gap-2">
              <svg style="color:#4ade80;" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              Agenda de hoy
            </span>
            <button onclick="openNewModal('evento')"
              class="text-xs flex items-center gap-1 transition-colors"
              style="color:#4ade80;">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Evento
            </button>
          </div>
          <div id="timeline-list" class="space-y-1"></div>
        </div>
      </section>

      <!-- ────── RIGHT: Inbox + Quick Notes ───────────────────── -->
      <section class="flex flex-col gap-4">

        <!-- Buzón pendientes -->
        <div class="card p-4 flex-1">
          <div class="section-header mb-4">
            <span class="flex items-center gap-2">
              <svg style="color:#f59e0b;" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/>
                <path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/>
              </svg>
              Buzón de pendientes
            </span>
            <button onclick="openNewModal('tarea')"
              class="text-xs flex items-center gap-1 transition-colors"
              style="color:#f59e0b;">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
              </svg>
              Tarea
            </button>
          </div>
          <div id="inbox-list" class="space-y-1"></div>
        </div>

        <!-- Notas rápidas -->
        <div class="card p-4">
          <div class="section-header mb-3">
            <span class="flex items-center gap-2">
              <svg style="color:#f59e0b;" xmlns="http://www.w3.org/2000/svg" width="14" height="14"
                   viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                   stroke-linecap="round" stroke-linejoin="round">
                <path d="M15.5 3H5a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2V8.5L15.5 3z"/>
                <polyline points="15 3 15 9 21 9"/>
              </svg>
              Notas rápidas
            </span>
            <button onclick="saveNotes()"
              class="text-xs flex items-center gap-1 transition-colors"
              style="color:#f59e0b;">
              <svg xmlns="http://www.w3.org/2000/svg" width="11" height="11" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
              </svg>
              Guardar
            </button>
          </div>
          <textarea id="quick-notes" class="posit-area"
            placeholder="Escribe aquí ideas, recordatorios o notas al vuelo...&#10;Se guardan automáticamente en tu navegador."></textarea>
          <p class="text-xs mt-1.5" style="color:#444;">Auto-guardado local · Ctrl+N para nueva tarea</p>
        </div>

      </section>
    </div>
  </main>

  <!-- Modales (inyectados por JS) -->
  <div id="modal-form"     style="display:none;" class="modal-backdrop"></div>
  <div id="modal-settings" style="display:none;" class="modal-backdrop"></div>

  <!-- Toasts -->
  <div id="toast-container"></div>

  <!-- Onboarding banner -->
  <div id="onboarding-banner" class="fixed bottom-6 left-6 hidden max-w-sm" style="z-index:90;">
    <div class="card p-4 shadow-2xl" style="border-color:#2e7d32;box-shadow:0 0 24px rgba(46,125,50,.3);">
      <div class="flex items-start gap-3">
        <div class="flex-shrink-0 w-8 h-8 rounded-lg flex items-center justify-center mt-0.5"
             style="background:#071a08;border:1px solid #1b4d1e;">
          <svg style="color:#4ade80;" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
               viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-semibold" style="color:#fff;">Configura tu GitHub</p>
          <p class="text-xs mt-0.5" style="color:#888;">Conecta tu repositorio para sincronizar la agenda</p>
          <button onclick="openSettings(); document.getElementById('onboarding-banner').style.display='none';"
                  class="btn-primary mt-3 text-xs !py-1.5 !px-3">
            Configurar ahora
          </button>
        </div>
        <button onclick="this.closest('#onboarding-banner').style.display='none'"
                style="color:#444;" class="flex-shrink-0 hover:text-white transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    (function() {
      try {
        const cfg = JSON.parse(localStorage.getItem('agendaCorp_config')) || {};
        if (!cfg.token || !cfg.owner || !cfg.repo) {
          setTimeout(() => {
            document.getElementById('onboarding-banner').style.display = 'block';
          }, 1200);
        }
      } catch(e) {}
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        });
      }
    })();
  </script>
</body>
</html>
